<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Search</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .search-container {
            text-align: center;
            background: #2d2d2d;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            margin-bottom: 1.5rem;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            background-color: #3d3d3d;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: background-color 0.2s;
        }

        input[type="text"]:focus {
            background-color: #4a4a4a;
        }

        button {
            padding: 12px 24px;
            border: none;
            background-color: #6366f1;
            color: white;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #4f46e5;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <h1>Search the Web</h1>
        <form id="proxy-form">
            <input type="text" id="address-bar" placeholder="Enter a URL or search term..." required autocomplete="off">
            <button type="submit">Go</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('proxy-form');
        const input = document.getElementById('address-bar');

        form.addEventListener('submit', async (event) => {
            event.preventDefault(); // Prevents the page from refreshing
            
            const query = input.value.trim();
            
            /* NOTE: To make UV work, you would register your Service Worker here 
               and encode the URL before passing it to your backend Bare server iframe.
               Since there is no backend connected, we are just logging the input.
            */
            
            console.log("Attempting to route to:", query);
            alert("Front-end is working! Connect a backend Bare Server and Service Worker to process: " + query);
        });
    </script>

</body>
</html>
